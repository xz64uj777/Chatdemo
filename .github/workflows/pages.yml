name: Build and publish Field Ops 3D

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out game
        uses: actions/checkout@v4

      - name: Reconstruct canonical Field Ops 3D source
        run: test -s index.html && echo "Using canonical Field Ops 3D index.html"

      - name: Validate HTML and JavaScript module syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          assert "<title>Field Ops 3D" in html, "Unexpected game entry point"
          match = re.search(r'<script type="module">([\s\S]*?)</script>', html)
          assert match, "No JavaScript module found"
          assert "three@0.160.0/build/three.module.js" in match.group(1), "Three.js import missing"
          Path("/tmp/field-ops.mjs").write_text(match.group(1), encoding="utf-8")
          print(f"Validated game HTML ({len(html)} characters)")
          PY
          node --check /tmp/field-ops.mjs

      - name: Package playable web build
        uses: actions/upload-artifact@v4
        with:
          name: Field-Ops-3D-web-game
          path: index.html
          if-no-files-found: error
          retention-days: 30

      - name: Set up Pages and enable it if needed
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage playable site
        run: |
          mkdir -p site
          cp index.html site/index.html

      - name: Upload static game
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
