<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#182126">
<title>Field Ops 3D — Corps Response</title>
<style>body{margin:0;background:#182126;color:#f5f5f2;font:16px system-ui;display:grid;min-height:100vh;place-items:center}main{max-width:32rem;padding:2rem;text-align:center}p{color:#c4d0d2;line-height:1.5}</style>
</head>
<body><main><h1>FIELD OPS 3D</h1><p id="status">Loading the supplied 3D game source…</p><noscript>JavaScript is required to start the game.</noscript></main>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    if(!('DecompressionStream' in window)) throw new Error('This browser does not support the source fallback. Open the deployed GitHub Pages build instead.');
    const paths=['part-01.bin','part-02.bin','part-03.bin','part-04.bin'];
    const buffers=await Promise.all(paths.map(async path=>{
      const response=await fetch('./field_ops_3d/parts/'+path);
      if(!response.ok) throw new Error('Game source is not available yet ('+response.status+').');
      return response.arrayBuffer();
    }));
    const total=buffers.reduce((n,b)=>n+b.byteLength,0);
    const bytes=new Uint8Array(total);
    let offset=0;
    for(const buffer of buffers){bytes.set(new Uint8Array(buffer),offset);offset+=buffer.byteLength;}
    const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    if(!html.includes('Field Ops 3D')||!html.includes('type="module"')) throw new Error('The game source could not be verified.');
    document.open();document.write(html);document.close();
  }catch(error){status.textContent='The game build is being prepared. If this message persists, open the repository Actions tab and check the latest Pages workflow. '+error.message;}
})();
</script></body></html>
